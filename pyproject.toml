[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepulse"
version = "1.0.0"
description = "Industrial IoT telemetry and predictive maintenance learning lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "numpy>=1.24,<3", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]
